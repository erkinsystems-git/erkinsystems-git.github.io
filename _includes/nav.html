<!-- ============================================================
  _includes/nav.html
  Desktop navigation — driven by site.nav_links in _config.yml
============================================================ -->
<nav class="site-nav" aria-label="Main navigation">
  <ul class="site-nav__list">
    {% for link in site.nav_links %}
    <li class="site-nav__item">
      <a href="{{ link.url | prepend: site.baseurl }}"
         class="site-nav__link {% if page.url == link.url %}active{% endif %}">
        {{ link.title }}
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
