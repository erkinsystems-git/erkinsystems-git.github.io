---
layout: default
---

<!-- Interior page: navy-toned hero banner + white content area -->
<section class="page-hero">
  <div class="container">
    <h1 class="page-hero__title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-hero__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</section>

<section class="page-content">
  <div class="container">
    {{ content }}
  </div>
</section>
